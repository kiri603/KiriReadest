[package]
name = "tauri-plugin-native-tts"
version = "0.1.0"
authors = [ "You" ]
description = ""
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-native-tts"

[dependencies]
tauri = { version = "2" }
serde = "1.0"
thiserror = "2"
schemars = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Media_Speech", "Win32_System_Com", "Win32_Globalization"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61.3", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
schemars = "0.8"
